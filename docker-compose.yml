services:
  postgres:
    image: postgres:16-alpine
    container_name: factura_ecf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecf_user
      POSTGRES_PASSWORD: ecf_secure_password
      POSTGRES_DB: factura_ecf_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecf_user -d factura_ecf_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: factura_ecf_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
